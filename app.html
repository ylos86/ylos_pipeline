<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ylos-ui" content="direction-c">
<title>Ylos Prod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Ylos Prod cockpit, direction C (docs/ui-workstream.md, canvas "Ylos Prod Home Mockup").
   Dark studio-tool chrome: flat panels, 2px radii, one hue per status, shapes and text that
   carry the meaning without colour (a dashed "empty", a "n/a", a "not reviewed" line). */
:root{
  --bg:#252525;--panel:#2d2d2d;--head:#333333;--raise:#383838;--sel:#3d3d3d;
  --line:#1b1b1b;--line2:#474747;--tx:#E4E4E4;--tx2:#B0B0B0;--tx3:#9E9E9E;
  --warn:#E0A53A;--bad:#EE6B63;--info:#A8C8FF;--ok:#3FA88B;
  --wip-bg:#23395a;--wip-fg:#A8C8FF;--pub-bg:#1f4a40;--pub-fg:#9EE5CF;
  --rev-bg:#3d3160;--rev-fg:#D3C6FF;--apr-bg:#2f6e59;--apr-fg:#E2FFF5;
  --font:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.5}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #DADADA;outline-offset:-2px}
a{color:var(--tx2)}a:hover{color:#fff}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1 1 auto}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
img.failed{visibility:hidden}

.app{display:flex;flex-direction:column;height:100vh}

/* --- top bar --- */
.top{height:36px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--head);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:10}
.brand{font-weight:600;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.tool{height:24px;padding:0 10px;border:1px solid var(--line2);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex-shrink:0}
.tool:hover:not(:disabled){background:#3d3d3d}
.tool.md{height:26px;font-size:12px}.tool.sm{font-size:12px;padding:0 9px}.tool.lg{height:30px;padding:0 12px}
.primary{height:30px;padding:0 14px;background:#ECECEC;color:#161616;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.primary:hover:not(:disabled){background:#fff}
.proj-btn .pmeta{color:var(--tx2);font-size:12px}
.search{display:flex;align-items:center;gap:8px;height:24px;width:280px;padding:0 8px;background:var(--bg);border:1px solid var(--line2);border-radius:2px}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--tx);font-size:12.5px;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.conn{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12px;white-space:nowrap}
.conn i{width:6px;height:6px;background:var(--tx3)}.conn.on i{background:var(--ok)}.conn.off i{background:var(--bad)}
.menu{position:absolute;top:31px;min-width:300px;max-width:420px;background:var(--raise);border:1px solid var(--line2);border-radius:2px;box-shadow:0 10px 28px rgba(0,0,0,.5);padding:4px 0;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:8px;padding:6px 12px;text-align:left}
.menu button:hover{background:var(--sel)}
.menu .sep{height:1px;background:var(--line2);margin:4px 0}
.menu .lbl{padding:6px 12px 2px;color:var(--tx3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
.menu .path{font-family:var(--mono);font-size:10.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .cur{color:var(--ok);font-family:var(--mono);font-size:10.5px}

.banner{padding:8px 12px;border-bottom:1px solid var(--line);background:#3a301c;color:#F3DDB0;display:flex;gap:10px;align-items:center;flex-shrink:0;line-height:1.4}
.banner b{color:#fff}

/* --- home: nav / main / aside --- */
.body{display:flex;flex:1;min-height:0}
.nav{width:188px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px 0 10px;overflow-y:auto}
.nav-h{padding:10px 12px 4px;color:var(--tx3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
.nav-h.gap{padding-top:14px}
.navi{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;width:100%;text-align:left}
.navi:hover{background:#363636}
.navi[aria-current="page"]{background:var(--sel);font-weight:600}
.navi .lbl{flex:1}
.navi .dot{width:7px;height:7px}
.navi .n{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.nav-plan{display:flex;justify-content:space-between;height:26px;align-items:center;padding:0 12px;color:var(--tx3)}
.nav-plan span+span{font-size:11px}
.nav-foot{padding:10px 12px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--tx3);line-height:1.7}
.nav-foot a{color:var(--tx3)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mainbar{height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.mainbar h1{margin:0;font-size:15px;font-weight:600}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;flex-shrink:0}
.seg button{height:24px;padding:0 10px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--sel)}
.scroll{flex:1;min-height:0;overflow:auto}

.mx{min-width:max-content}
.mx-head{display:flex;align-items:center;height:28px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--tx3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0;z-index:1}
.c-thumb{width:58px;flex-shrink:0}
.c-name{width:160px;flex-shrink:0;min-width:0;padding-right:10px}
.c-step{width:120px;flex-shrink:0;padding-right:8px;min-width:0}
.c-last{flex:1;min-width:92px;text-align:right}
.mx-row{display:flex;align-items:center;width:100%;height:66px;padding:0 12px;border-bottom:1px solid var(--line);text-align:left}
.mx-row:hover{background:#2f2f2f}
.mx-row[aria-pressed="true"]{background:var(--sel);box-shadow:inset 0 0 0 1px #6a6a6a}
.th48{position:relative;width:48px;height:48px;overflow:hidden;background:#1e1e1e;border:1px solid #474747}
.th48.none{border:1px dashed #575757}
.th48 img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;font-family:var(--mono);background:rgba(0,0,0,.72);color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.s{left:2px;bottom:2px;font-size:8.5px;line-height:12px;padding:0 3px}
.tag.l{left:6px;top:6px;font-size:9.5px;line-height:14px;padding:0 5px;max-width:calc(100% - 12px)}
.tag.m{left:8px;top:8px;font-size:10px;line-height:16px;padding:0 6px;max-width:calc(100% - 16px)}
.ename{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow2{display:flex;gap:6px;margin-top:3px;align-items:center;min-width:0}
.etype{font-family:var(--mono);font-size:10.5px;color:var(--tx3);white-space:nowrap}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:500;border:1px solid currentColor;border-radius:2px;padding:0 4px;white-space:nowrap}
.warn-c{color:var(--warn)}.bad-c{color:var(--bad)}.info-c{color:var(--info)}
.cell{display:flex;gap:6px;align-items:flex-start;min-width:0}
.cell>img{width:30px;height:30px;object-fit:cover;display:block;flex-shrink:0;border:1px solid #474747}
.cell .cc{flex:1;min-width:0}
.chip{height:22px;display:flex;align-items:center;padding:0 7px;border-radius:2px;font-family:var(--mono);font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent;overflow:hidden}
.k-na{color:#929292}
.k-empty{color:#9E9E9E;border:1px dashed #575757}
.k-wip{background:var(--wip-bg);color:var(--wip-fg);border-color:var(--wip-bg)}
.k-published{background:var(--pub-bg);color:var(--pub-fg);border-color:var(--pub-bg)}
.k-review{background:var(--rev-bg);color:var(--rev-fg);border-color:var(--rev-bg)}
.k-approved{background:var(--apr-bg);color:var(--apr-fg);border-color:var(--apr-bg)}
.sub{height:14px;margin-top:3px;font-family:var(--mono);font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.warn{color:var(--warn)}.sub.info{color:var(--info)}
.last{font-family:var(--mono);font-size:11.5px;color:var(--tx2);white-space:nowrap}
.broken-msg{flex:1;min-width:0;color:var(--bad);line-height:1.4;padding-right:10px}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:12px}
.card{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:2px;background:var(--panel);text-align:left;overflow:hidden}
.card:hover{border-color:#6a6a6a}
.card[aria-pressed="true"]{border-color:#BDBDBD}
.sq{position:relative;width:100%;aspect-ratio:1/1;background:#1e1e1e;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px;text-align:center;padding:12px}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:8px 10px 10px}
.card .cl{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.strip{display:flex;gap:2px;margin-top:8px}
.strip span{flex:1;height:5px}

.empty{padding:40px 24px;max-width:560px;line-height:1.55}
.empty h2{font-size:15px;font-weight:600;margin:0}
.empty p{color:var(--tx2);margin:6px 0 0}
.empty .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.recent{margin-top:18px}
.recent button{display:block;width:100%;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.recent button:hover{background:var(--panel)}

.aside{width:300px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
.pad{display:flex;flex-direction:column;gap:16px;padding:14px}
.pad.tight{gap:10px}
.lookimg{position:relative;width:100%;aspect-ratio:1/1;background:#1e1e1e;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.lookimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lookimg .noimg{color:var(--tx3);text-align:center;padding:24px;line-height:1.5}
.tabs-sm{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tabs-sm button{height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:2px;font-size:12px}
.tabs-sm button[aria-pressed="true"]{border-color:#BDBDBD;background:var(--sel)}
.note{margin-top:8px;font-size:12px;line-height:1.45;color:var(--tx2)}
.note.warn{color:var(--warn)}
.full{font-family:var(--mono);font-size:11px;color:var(--tx3);word-break:break-all}
.ttl{font-size:19px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.meta{color:var(--tx2);margin-top:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .primary{flex:1}
.aside .acts .primary{flex:1 1 100%;display:block;line-height:30px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aside .acts .tool.lg{flex:1 1 0}
.issue{border:1px solid currentColor;border-radius:2px;padding:10px;line-height:1.45}
.issue b{display:block}
.issue .t{color:var(--tx);margin-top:4px}
.sec-h{color:var(--tx3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.steprow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.steprow .nm{width:76px;text-transform:capitalize;flex-shrink:0}
.steprow .chip{height:20px;font-size:11px;padding:0 6px;min-width:64px}
.steprow .sb{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--tx3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steprow .sb.warn{color:var(--warn)}.steprow .sb.info{color:var(--info)}
.ph-title{font-size:16px;font-weight:600}
.ph-text{color:var(--tx2);margin-top:4px;line-height:1.45}
.icard{background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:10px}
.icard .h{display:flex;gap:8px;align-items:center}
.icard .h i{width:8px;height:8px;flex-shrink:0}
.icard .h b{font-weight:600}
.icard .e{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:4px;overflow-wrap:anywhere}
.icard .x{margin-top:6px;line-height:1.45}
.icard .f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.icard .f span{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.box{background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:10px;line-height:1.45}
.box.warn{border-color:var(--warn)}
.box .kv{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pinrow{padding:8px 0;border-bottom:1px solid var(--line)}
.pinrow .a,.pinrow .b{display:flex;justify-content:space-between;gap:8px}
.pinrow .b{margin-top:3px;font-size:12px}
.pinrow select{width:100%;height:26px;margin-top:6px;background:var(--bg);border:1px solid var(--line2);border-radius:2px;padding:0 6px}

/* --- entity page --- */
.entity{flex:1;min-height:0;display:flex;flex-direction:column}
.crumbs{height:38px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);flex-shrink:0;white-space:nowrap;overflow:hidden}
.crumbs .sepr{color:var(--tx3)}
.crumbs .nav-btn{width:26px;height:24px;padding:0}
.ehead{display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.eimg{position:relative;width:132px;height:132px;flex-shrink:0;background:#1e1e1e;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px}
.eimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eimg .tag{left:4px;bottom:4px;right:4px;font-size:8.5px;line-height:13px;padding:0 4px}
.ehead .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.ehead h1{margin:3px 0 0;font-size:24px;font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chips span{font-family:var(--mono);font-size:10.5px;color:var(--tx2);border:1px solid var(--line2);border-radius:2px;padding:1px 6px}
.ebanners{flex-shrink:0}
.ebanner{margin:12px 16px 0;padding:10px 12px;border:1px solid currentColor;border-radius:2px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.ebanner .bt{flex:1;min-width:0;color:var(--tx)}
.ebanner .bt b{display:block}
.ebanner .src{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-top:4px}
.steptabs{display:flex;gap:2px;padding:12px 16px 0;border-bottom:1px solid var(--line2);flex-shrink:0;overflow-x:auto}
.steptab{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid transparent;border-bottom:0;border-radius:2px 2px 0 0;margin-bottom:-1px;white-space:nowrap}
.steptab:hover{background:#333}
.steptab[aria-selected="true"]{border-color:var(--line2);background:var(--panel)}
.steptab[aria-selected="true"] .nm{font-weight:600}
.steptab .nm{text-transform:capitalize}
.steptab .chip{height:17px;font-size:10.5px;padding:0 5px;font-weight:400}
.split{display:flex;flex:1;min-height:0}
.vers{flex:1;min-width:0;overflow:auto;padding:14px 16px 24px;background:var(--panel)}
.vers-h{display:flex;align-items:baseline;gap:10px}
.vers-h h2{margin:0;font-size:15px;font-weight:600;text-transform:capitalize}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow>img,.vrow>.ph{width:72px;height:72px;flex-shrink:0;border:1px solid var(--line2)}
.vrow>img{object-fit:cover;display:block}
.vrow>.ph{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:10px;text-align:center}
.check{width:20px;height:20px;flex-shrink:0;border:1px solid #6a6a6a;border-radius:2px;display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"]{background:#ECECEC;border-color:#ECECEC}
.vmain{flex:1;min-width:0}
.vtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vlabel{font-family:var(--mono);font-size:13px;font-weight:600}
.pill{font-family:var(--mono);font-size:10px;line-height:15px;padding:0 5px;border:1px solid var(--line2);border-radius:2px;color:var(--tx2);white-space:nowrap}
.pill.latest{background:#ECECEC;color:#161616;border-color:#ECECEC}
.pill.pin{border-color:var(--tx2);color:var(--tx)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.apr{background:var(--apr-bg);color:var(--apr-fg);border-color:var(--apr-bg)}
.pill.rev{background:var(--rev-bg);color:var(--rev-fg);border-color:var(--rev-bg)}
.vdate{font-family:var(--mono);font-size:11.5px;color:var(--tx2);margin-top:5px}
.vcom{font-size:12.5px;margin-top:3px}
.cmp{margin-top:12px;padding:12px;background:var(--bg);border:1px solid var(--line2);border-radius:2px}
.cmp .ch{display:flex;align-items:center;gap:10px}
.cmp .cbody{display:flex;gap:12px;margin-top:10px;align-items:flex-start;flex-wrap:wrap}
.cmp figure{margin:0}
.cmp figure img,.cmp figure .ph{width:236px;height:236px;object-fit:cover;display:block;border:1px solid var(--line2)}
.cmp figure .ph{display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.cmp figcaption{font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:4px}
.diff{flex:1;min-width:240px}
.diff .dh{display:flex;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.diff .dr{display:flex;padding:6px 0;border-bottom:1px solid var(--line)}
.diff .k{width:86px;color:var(--tx3);flex-shrink:0}
.diff .v{flex:1;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;padding-right:6px}
.dashbox{margin-top:12px;padding:22px;border:1px dashed var(--line2);border-radius:2px;color:var(--tx2);line-height:1.5;max-width:560px}
.abox{margin-top:12px;padding:8px 10px;border:1px dashed var(--line2);border-radius:2px}
.abox .ah{display:flex;align-items:center;gap:8px}
.abox .ar{font-family:var(--mono);font-size:11.5px;padding:3px 0;color:var(--tx3)}
.side{width:330px;flex-shrink:0;border-left:1px solid var(--line);overflow-y:auto}
.side section{padding:14px;border-bottom:1px solid var(--line)}
.side section:last-child{border-bottom:0}
.sh{display:flex;align-items:center;gap:8px}
.sh b{font-weight:600}
.sh .st{color:var(--tx3);text-transform:capitalize}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.wrow .wl{font-family:var(--mono);font-size:12px;font-weight:600;width:38px;flex-shrink:0}
.dcc{font-family:var(--mono);font-size:9.5px;line-height:14px;padding:0 4px;border:1px solid var(--line2);border-radius:2px;color:var(--tx2);flex-shrink:0;text-transform:uppercase}

}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">YlosProd</span>
    <div id="js-proj-wrap" style="position:relative">
      <button class="tool proj-btn" id="js-proj-btn" aria-haspopup="menu" aria-expanded="false" title="Switch project">
        <span class="mono" id="js-proj-name" style="font-size:12px">No project</span>
        <span class="pmeta" id="js-proj-meta"></span>
        <svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="#B0B0B0" stroke-width="1.4"/></svg>
      </button>
      <div class="menu hidden" id="js-proj-menu" role="menu"></div>
    </div>
    <div class="grow"></div>
    <label class="search" id="js-search-wrap">
      <span class="sr">Search entities</span>
      <input type="search" id="js-search" placeholder="Search entities" autocomplete="off" spellcheck="false">
      <span class="kbd" aria-hidden="true">⌘K</span>
    </label>
    <span class="conn" id="js-conn"><i></i><span id="js-conn-label">Connecting</span></span>
    <button class="tool" id="js-new-entity" data-act="new-entity">New entity</button>
  </header>
  <div class="banner hidden" id="js-banner" role="status"></div>
  <div class="body" id="js-home">
    <nav class="nav" id="js-nav" aria-label="Project"></nav>
    <main class="main" id="js-main"></main>
    <aside class="aside" id="js-aside" aria-label="Details"></aside>
  </div>
  <div class="entity hidden" id="js-entity"></div>
</div>
<div class="overlay hidden" id="js-modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="js-toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* Ylos Prod cockpit, direction C.
   Presentation and verbs only. Every rule (status, the version shown with its render, newer
   unpublished work, abandoned reservations, dependencies) is computed in create_project.py
   and reaches this page through ylos_ui.py, so the Blender browser and the Houdini panel show
   the same thing (principle 5). Vocabulary (families, types, steps, statuses, production
   types) comes from GET /api/config, never from this file. */

const BASE = location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8765';
const POLL_MS = 30000;
const FAMS = ['asset', 'set', 'shot'];
const FAM_DIR = { asset: 'assets', set: 'sets', shot: 'shots' };
const DIR_FAM = { assets: 'asset', sets: 'set', shots: 'shot' };
const FAM_LABEL = { asset: 'Assets', set: 'Sets', shot: 'Shots' };
const FAM_ONE = { asset: 'asset', set: 'set', shot: 'shot' };
const LAB = { wip: 'WIP', published: 'PUB', review: 'REV', approved: 'APR', empty: '—', na: 'n/a' };
const STRIP = { wip: '#5B8BD0', published: '#3FA88B', review: '#8E7BD6', approved: '#7EE0C2', empty: '#474747', na: 'transparent' };
const SOURCE = {
  custom:  { short: 'PRV', tag: 'Preview · custom', tab: 'Preview',
             note: 'Custom preview, set by hand. It is not the render of a published version.' },
  publish: { short: 'PUB', tag: 'Publish render', tab: 'Entity image', note: '' },
  legacy:  { short: 'PUB', tag: 'Legacy publish', tab: 'Legacy',
             note: 'Render of a publish made before the two-phase contract.' },
  wip:     { short: 'WIP', tag: 'WIP thumbnail', tab: 'WIP',
             note: 'Thumbnail of a scenefile. It is not the render of a published version.' },
};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const S = {
  online: false, project: null, recent: [],
  config: { families: {}, prod_types: [], schema_version: '' },
  assets: [], assetsRaw: '', assetsRev: 0, loaded: false, legacyServer: false,
  web: null,
  fam: readPref('ylos.fam', 'asset'), view: readPref('ylos.view', 'matrix'), panel: 'look',
  sel: null, imgTab: 0, search: '',
  route: { page: 'home' },
  entity: null, entityData: null, entityRaw: '', entityStep: null, cmp: null, showAbandoned: false,
  thumbToken: Date.now(), thumbSig: '', homeSig: '',
};
if (!FAMS.includes(S.fam)) S.fam = 'asset';
if (!['matrix', 'gallery'].includes(S.view)) S.view = 'matrix';

// ---------------------------------------------------------------- helpers
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(3, '0');
const ver = v => (v || v === 0) ? 'v' + pad(v) : '—';
function readPref(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }
function writePref(k, v) { try { localStorage.setItem(k, v); } catch { /* private window */ } }
function parseDate(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : d; }
function fmtDay(iso) {
  const d = parseDate(iso); if (!d) return '';
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtWhen(iso) {
  const d = parseDate(iso); if (!d) return '—';
  return fmtDay(iso) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function shortName(full) {
  const p = String(full || '').split('_');
  if (p.length >= 3) return p.slice(1, -1).join('_') + (p[p.length - 1] === 'Default' ? '' : ' ' + p[p.length - 1]);
  return String(full || '');
}
function range(versions) {
  const v = [...versions].sort((a, b) => a - b);
  if (!v.length) return '';
  if (v.length === 1) return ver(v[0]);
  const contiguous = v.every((x, i) => i === 0 || x === v[i - 1] + 1);
  return contiguous ? ver(v[0]) + ' to ' + ver(v[v.length - 1]) : v.map(ver).join(', ');
}
function thumb(url) { return url ? url + (url.includes('?') ? '&' : '?') + 't=' + S.thumbToken : ''; }
function img(url, alt, attrs = '') { return `<img src="${esc(thumb(url))}" alt="${esc(alt)}" loading="lazy" ${attrs}>`; }
const statusWord = st => ({ review: 'In review', approved: 'Approved', published: 'Published', wip: 'Work in progress', empty: 'Empty' }[st] || st);

// ---------------------------------------------------------------- server
async function api(path, opts = {}) {
  const res = await fetch(BASE + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text || res.statusText }; }
  return { ok: res.ok, status: res.status, data, text };
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });

async function checkServer() {
  try {
    const { ok, data } = await api('/api/project');
    setOnline(true);
    const before = S.project && S.project._project_path;
    S.project = ok ? data : null;
    if ((S.project && S.project._project_path) !== before) { S.web = null; S.sel = null; }
  } catch {
    setOnline(false);
    S.project = null;
  }
  renderHeader();
}

function setOnline(v) {
  S.online = v;
  el('js-conn').className = 'conn ' + (v ? 'on' : 'off');
  el('js-conn-label').textContent = v ? 'Server connected' : 'Server offline';
}

async function loadConfig() {
  try {
    const { ok, data } = await api('/api/config');
    if (ok) S.config = Object.assign({}, S.config, data);
  } catch { /* offline: the next poll retries */ }
}

async function loadAssets() {
  if (!S.online || !S.project) { S.assets = []; S.assetsRaw = ''; S.loaded = true; return false; }
  try {
    const { ok, data, text } = await api('/api/assets');
    if (!ok) return false;
    S.loaded = true;
    if (text === S.assetsRaw) return false;
    S.assetsRaw = text;
    S.assetsRev += 1;
    S.assets = data.assets || [];
    // The server keeps running the code it started with: a cockpit newer than its server finds
    // no 'overview' on the cards and says so, instead of quietly showing less.
    S.legacyServer = S.assets.some(a => !a.broken && !('overview' in a));
    const sig = S.assets.map(a => a.name + '|' + (a.thumb || '') + '|' + Object.values((a.overview && a.overview.steps) || {})
      .map(s => s.shown_thumb || '').join(',')).join(';');
    if (sig !== S.thumbSig) { S.thumbSig = sig; S.thumbToken = Date.now(); }
    return true;
  } catch {
    setOnline(false);
    return false;
  }
}

async function loadWebPins() {
  if (!S.online || !S.project) { S.web = null; return; }
  try {
    const { ok, data } = await api('/api/web-pins');
    S.web = ok ? data : { error: data.error || 'Error' };
  } catch { S.web = { error: 'Server unavailable' }; }
}

async function loadRecent() {
  try {
    const { ok, data } = await api('/api/recent-projects');
    S.recent = ok && Array.isArray(data) ? data : [];
  } catch { S.recent = []; }
}

// ---------------------------------------------------------------- model (presentation only)
function famOf(a) { return DIR_FAM[a.family] || 'asset'; }
function famEntities(fam) { return S.assets.filter(a => famOf(a) === fam); }
function lastActivity(a) { return (a.overview && a.overview.last_activity_utc) || ''; }
function visibleList(fam = S.fam) {
  const q = S.search.trim().toLowerCase();
  return famEntities(fam)
    .filter(a => !q || a.name.toLowerCase().includes(q) || (a.type || '').toLowerCase().includes(q))
    .sort((x, y) => (x.broken ? 1 : 0) - (y.broken ? 1 : 0)
      || lastActivity(y).localeCompare(lastActivity(x)) || x.name.localeCompare(y.name));
}
function famColumns(fam, list) {
  const declared = new Set();
  list.forEach(a => (a.broken ? [] : a.steps || []).forEach(s => declared.add(s)));
  const base = ((S.config.families[fam] || {}).steps || []);
  const cols = base.filter(s => declared.has(s));
  declared.forEach(s => { if (!cols.includes(s)) cols.push(s); });
  return cols.length ? cols : base;
}

// One step of one entity, as the orchestrator described it (entity_overview). The legacy
// branch only serves a server still running code from before the overview (banner shown).
// It pairs a version with a render only where that server paired them itself: the latest
// publish, unless a status set by hand applies to another version (or to one it cannot name).
function stepInfo(e, s) {
  const ov = e.overview && e.overview.steps ? e.overview.steps[s] : null;
  if (ov) return ov;
  const raw = (e.step_status || {})[s];
  const full = raw && typeof raw === 'object' ? raw : null;   // entity detail: get_step_status
  const status = full ? full.status : (raw || 'empty');       // home card: the status word only
  const explicit = full ? !!full.explicit : (S.config.step_status_explicit || []).includes(status);
  const lv = (e.last_versions || {})[s] || null;
  const paired = !!lv && (!explicit || (!!full && full.version === lv.version));
  return {
    status, explicit,
    version: full ? full.version : null, set_utc: full ? full.set_utc : null,
    latest_version: full && full.latest_version != null ? full.latest_version : (lv ? lv.version : null),
    behind: full ? !!full.behind : false,
    shown_version: paired ? lv.version : null, shown_thumb: paired ? lv.thumb : null,
    shown_ext: paired ? lv.ext : null, shown_published_utc: null,
    latest_scenefile: null, newer_wip: false, abandoned: [],
  };
}

function cellModel(e, s) {
  if (!(e.steps || []).includes(s)) {
    return { kind: 'na', text: 'n/a', sub: '', tone: '', img: null, title: `${s}: not one of this entity's steps` };
  }
  const i = stepInfo(e, s);
  const st = LAB[i.status] ? i.status : 'empty';
  const m = { kind: st, text: LAB[st], sub: '', tone: '', img: null, title: `${s}: ${statusWord(st).toLowerCase()}` };
  const sf = i.latest_scenefile;
  if (st === 'published' || st === 'review' || st === 'approved') {
    m.text = LAB[st] + (i.shown_version ? ' ' + ver(i.shown_version) : '');
    m.img = i.shown_thumb || null;
    m.sub = [(i.shown_ext || '').toUpperCase(), fmtDay(i.shown_published_utc)].filter(Boolean).join(' · ');
    m.title = `${s}: ${statusWord(st).toLowerCase()} ${ver(i.shown_version)}` + (m.sub ? ` (${m.sub})` : '');
    if (st !== 'published' && i.version) m.sub = 'for ' + ver(i.version);
    if (i.behind && i.latest_version) {
      m.sub = ver(i.latest_version) + ' not reviewed'; m.tone = 'warn';
      m.title += `. ${ver(i.latest_version)} was published after it and is not reviewed.`;
    } else if (i.newer_wip && sf) {
      m.sub = '+ WIP ' + ver(sf.version) + (sf.mtime_utc ? ' · ' + fmtDay(sf.mtime_utc) : ''); m.tone = 'info';
      m.title += `. Scenefile ${ver(sf.version)} was saved after this publish.`;
    }
  } else if (st === 'wip') {
    m.text = 'WIP' + (sf ? ' ' + ver(sf.version) : '');
    m.sub = sf && sf.mtime_utc ? 'saved ' + fmtDay(sf.mtime_utc) : '';
    m.title = `${s}: work in progress` + (sf ? `, scenefile ${ver(sf.version)}` : '');
  } else {
    m.title = `${s}: declared, nothing on disk yet`;
  }
  return m;
}

function entityIssue(a) {
  if (a.broken) return { label: 'ORPHAN', sev: 'bad', title: 'Orphan folder',
    text: 'manifest.json is missing: this folder was never created by the pipeline and cannot be published as-is.' };
  const ab = Object.entries((a.overview && a.overview.steps) || {}).filter(([, i]) => (i.abandoned || []).length);
  const n = ab.reduce((t, [, i]) => t + i.abandoned.length, 0);
  if (n) return { label: n + ' ABANDONED', sev: 'warn', title: 'Abandoned publish reservations',
    text: ab.map(([s, i]) => `${s} ${range(i.abandoned)}`).join('; ') + ': reserved and never finalized. They stay in the manifest as pending, nothing to import.' };
  if (a.outdated) return { label: a.outdated + ' OUTDATED', sev: 'warn', title: 'Outdated imports',
    text: `${a.outdated} import${a.outdated > 1 ? 's' : ''} of the latest publish ${a.outdated > 1 ? 'have' : 'has'} a newer version.` };
  return null;
}

function integrityIssues() {
  const out = [];
  for (const a of S.assets) {
    const fam = famOf(a);
    if (a.broken) {
      out.push({ sev: 'bad', title: 'Orphan folder', where: `${a.family}/${a.name}`, target: a.name, fam,
        text: 'manifest.json is missing: never created by the pipeline, not publishable as-is.', source: 'Detected by list_entities' });
      continue;
    }
    for (const [s, i] of Object.entries((a.overview && a.overview.steps) || {})) {
      if ((i.abandoned || []).length) out.push({ sev: 'warn', title: 'Abandoned publish reservations', where: `${a.name} · ${s}`,
        target: a.name, fam, step: s, text: `${range(i.abandoned)} reserved and never finalized. They stay in the manifest as pending.`,
        source: 'Detected by abandoned_reservations' });
      if (i.behind) out.push({ sev: 'warn', title: 'Approval behind', where: `${a.name} · ${s}`, target: a.name, fam, step: s,
        text: `${statusWord(i.status)} for ${ver(i.version)}. ${ver(i.latest_version)} was published after it and is not reviewed.`,
        source: 'Detected by get_step_status' });
    }
    if (a.outdated) out.push({ sev: 'warn', title: 'Outdated imports', where: a.name, target: a.name, fam,
      text: `${a.outdated} import${a.outdated > 1 ? 's' : ''} of the latest publish ${a.outdated > 1 ? 'have' : 'has'} a newer version.`,
      source: 'Detected by entity_dependencies' });
  }
  return out.sort((x, y) => (x.sev === 'bad' ? 0 : 1) - (y.sev === 'bad' ? 0 : 1));
}

// The one action a row leads to: reopen the scenefile saved last, else start the first step.
function primaryAction(a) {
  if (!a || a.broken) return null;
  let best = null;
  for (const s of a.steps || []) {
    const sf = stepInfo(a, s).latest_scenefile;
    if (sf && sf.dcc === 'blender' && (!best || (sf.mtime_utc || '') > (best.sf.mtime_utc || ''))) best = { s, sf };
  }
  if (best) return { label: `Open ${best.s} WIP ${ver(best.sf.version)}`, act: 'open-wip', step: best.s, v: best.sf.version };
  // A server from before entity_overview does not say which scenefile is the newest: open the
  // first step that has work, and let the server pick its latest WIP (else its publish).
  const busy = !a.overview && (a.steps || []).find(s => stepInfo(a, s).status !== 'empty');
  if (busy) return { label: `Open ${busy}`, act: 'open-step', step: busy };
  const first = (a.steps || [])[0];
  return first ? { label: `New ${first} scene`, act: 'new-scene', step: first } : null;
}

// Images of an entity for the quick look: its own image, then each step's shown render.
function imageSources(a) {
  const out = [];
  const steps = a.broken ? [] : (a.steps || []);
  const renders = steps.map(s => [s, stepInfo(a, s)]).filter(([, i]) => i.shown_thumb)
    .map(([s, i]) => ({ label: `${s} ${ver(i.shown_version)}`, url: i.shown_thumb, tag: `Publish · ${s} ${ver(i.shown_version)}`, note: '' }));
  const base = (u) => (u || '').split('?')[0];
  if (a.thumb) {
    const same = renders.find(r => base(r.url) === base(a.thumb));
    if (same) out.push(same);
    else { const src = SOURCE[a.thumb_source] || SOURCE.publish; out.push({ label: src.tab, url: a.thumb, tag: src.tag, note: src.note }); }
  }
  renders.forEach(r => { if (!out.some(o => base(o.url) === base(r.url))) out.push(r); });
  return out;
}

// ---------------------------------------------------------------- header, banner
function renderHeader() {
  const p = S.project;
  el('js-proj-name').textContent = p ? (p.display_name || p.name || '—') : 'No project';
  const target = p ? p.pipeline_target : '';
  el('js-proj-meta').textContent = p ? [p.prod_type, target ? (target === 'web' ? 'web → GLB' : 'offline → USD') : ''].filter(Boolean).join(' · ') : '';
  el('js-new-entity').disabled = !(S.online && p);
  const banner = el('js-banner');
  if (S.online && S.legacyServer) {
    banner.innerHTML = '<b>Ylos is still running older server code.</b> Steps show less than they should. Double-click Ylos and choose Restart to load the new code.';
    banner.classList.remove('hidden');
  } else banner.classList.add('hidden');
}

function renderProjectMenu() {
  const menu = el('js-proj-menu');
  const cur = S.project && S.project._project_path;
  const items = S.recent.map(path => `
    <button role="menuitem" data-act="set-project" data-path="${esc(path)}">
      <span class="grow" style="min-width:0"><span style="display:block">${esc(path.split('/').pop())}</span>
      <span class="path" style="display:block">${esc(path)}</span></span>
      ${path === cur ? '<span class="cur">OPEN</span>' : ''}
    </button>`).join('');
  menu.innerHTML = (items ? `<div class="lbl">Recent projects</div>${items}<div class="sep"></div>` : '')
    + `<button role="menuitem" data-act="open-project">Open project…</button>
       <button role="menuitem" data-act="new-project">New project… <span class="grow"></span><span class="kbd">⇧⌘N</span></button>
       <div class="sep"></div>
       <button role="menuitem" data-act="classic">Classic view</button>`;
}
function toggleProjectMenu(force) {
  const menu = el('js-proj-menu');
  const open = force === undefined ? menu.classList.contains('hidden') : force;
  if (open) renderProjectMenu();
  menu.classList.toggle('hidden', !open);
  el('js-proj-btn').setAttribute('aria-expanded', String(open));
}

// ---------------------------------------------------------------- home: nav
function renderNav() {
  const nav = el('js-nav');
  if (!S.online || !S.project) { nav.innerHTML = navFooter(); return; }
  const issues = integrityIssues();
  const fams = FAMS.map(f => {
    const ents = famEntities(f);
    const bad = ents.some(a => a.broken);
    const warn = !bad && issues.some(i => i.fam === f);
    const cur = S.panel !== 'integrity' && S.panel !== 'web' && S.fam === f;
    return `<button class="navi" data-act="fam" data-fam="${f}" ${S.fam === f ? 'aria-current="page"' : ''}>
      <span class="lbl">${FAM_LABEL[f]}</span>
      ${bad || warn ? `<span class="dot" style="background:${bad ? 'var(--bad)' : 'var(--warn)'}" title="${bad ? 'Orphan folder' : 'Needs attention'}"></span>` : ''}
      <span class="n">${ents.length}</span></button>`;
  }).join('');
  const worst = issues.some(i => i.sev === 'bad') ? 'var(--bad)' : (issues.length ? 'var(--warn)' : 'var(--line2)');
  const pins = S.web && S.web.pins ? Object.keys(S.web.pins).length : 0;
  const webDot = S.web && !S.web.error && !S.web.target_dir && pins ? 'var(--warn)' : 'var(--line2)';
  nav.innerHTML = `
    <div class="nav-h">Entities</div>${fams}
    <div class="nav-h gap">Project</div>
    <button class="navi" data-act="panel" data-panel="integrity" ${S.panel === 'integrity' ? 'aria-current="page"' : ''}>
      <span class="lbl">Integrity</span><span class="dot" style="background:${worst}"></span><span class="n">${issues.length}</span></button>
    <button class="navi" data-act="panel" data-panel="web" ${S.panel === 'web' ? 'aria-current="page"' : ''}>
      <span class="lbl">Web pins</span><span class="dot" style="background:${webDot}"></span><span class="n">${S.web && !S.web.error ? pins : '·'}</span></button>
    <div class="nav-h gap">Pre-production</div>
    <div class="nav-plan"><span>References</span><span>planned</span></div>
    <div class="nav-plan"><span>Boards</span><span>planned</span></div>
    <div class="grow"></div>
    ${navFooter()}`;
}
function navFooter() {
  const p = S.project;
  const lines = [];
  if (p) lines.push(esc([p.prod_type, p.pipeline_target].filter(Boolean).join(' · ')));
  if (S.config.schema_version) lines.push('schema ' + esc(S.config.schema_version));
  lines.push('<a href="/classic">Classic view</a>');
  return `<div class="nav-foot">${lines.join('<br>')}</div>`;
}

// ---------------------------------------------------------------- home: main
function renderMain(force) {
  const main = el('js-main');
  const list = (S.online && S.project) ? visibleList() : [];
  const sig = JSON.stringify([S.online, !!S.project, S.loaded, S.fam, S.view, S.search, S.assetsRev, S.thumbToken, list.map(a => a.name)]);
  if (!force && sig === S.homeSig) { markSelection(); return; }
  S.homeSig = sig;
  const scroller = main.querySelector('.scroll');
  const keep = scroller ? [scroller.scrollTop, scroller.scrollLeft] : null;

  if (!S.online) { main.innerHTML = offlineHTML(); return; }
  if (!S.project) { main.innerHTML = noProjectHTML(); return; }
  const total = famEntities(S.fam).length;
  const count = S.search ? `${list.length} of ${total}` : `${total} ${total === 1 ? 'entity' : 'entities'}`;
  let body;
  if (!S.loaded) body = '<div class="empty"><p>Loading…</p></div>';
  else if (!total) body = emptyFamilyHTML(S.fam);
  else if (!list.length) body = `<div class="empty"><h2>No match</h2><p>Nothing in ${FAM_LABEL[S.fam].toLowerCase()} matches “${esc(S.search)}”.</p></div>`;
  else body = S.view === 'gallery' ? galleryHTML(list) : matrixHTML(list);
  main.innerHTML = `
    <div class="mainbar">
      <h1>${FAM_LABEL[S.fam]}</h1><span class="mono muted" style="font-size:12px">${count}</span>
      <div class="grow"></div>
      <span class="dim" style="font-size:12px">${S.legacyServer ? 'Sorted by name' : 'Sorted by last activity'}</span>
      <div class="seg" role="group" aria-label="View">
        <button data-act="view" data-view="matrix" aria-pressed="${S.view === 'matrix'}">Matrix</button>
        <button data-act="view" data-view="gallery" aria-pressed="${S.view === 'gallery'}">Gallery</button>
      </div>
    </div>
    <div class="scroll">${body}</div>`;
  if (keep) { const sc = main.querySelector('.scroll'); sc.scrollTop = keep[0]; sc.scrollLeft = keep[1]; }
  markSelection();
}

function matrixHTML(list) {
  const cols = famColumns(S.fam, list);
  const head = cols.map(s => `<div class="c-step">${esc(s)}</div>`).join('');
  const rows = list.map(a => {
    const iss = entityIssue(a);
    const src = SOURCE[a.thumb_source] || SOURCE.publish;
    const thumbBox = a.thumb
      ? `<div class="th48">${img(a.thumb, '')}<span class="tag s">${src.short}</span></div>`
      : '<div class="th48 none"></div>';
    const cells = a.broken
      ? `<div class="broken-msg">manifest.json missing. Never created by the pipeline, not publishable as-is.</div>`
      : cols.map(s => {
          const c = cellModel(a, s);
          return `<div class="c-step" title="${esc(c.title)}"><div class="cell">
            ${c.img ? img(c.img, `Render of ${s} ${c.text.split(' ').pop()}`) : ''}
            <div class="cc"><div class="chip k-${c.kind}">${esc(c.text)}</div><div class="sub ${c.tone}">${esc(c.sub)}</div></div>
          </div></div>`;
        }).join('') + `<div class="c-last last">${esc(fmtWhen(lastActivity(a)))}</div>`;
    return `<button class="mx-row" data-act="pick" data-name="${esc(a.name)}" aria-pressed="false">
      <div class="c-thumb">${thumbBox}</div>
      <div class="c-name"><div class="ename" title="${esc(a.name)}">${esc(shortName(a.name))}</div>
        <div class="erow2"><span class="etype">${esc(a.type || '—')}</span>${iss ? `<span class="badge ${iss.sev}-c">${esc(iss.label)}</span>` : ''}</div></div>
      ${cells}
    </button>`;
  }).join('');
  return `<div class="mx" role="list">
    <div class="mx-head"><div class="c-thumb"></div><div class="c-name">Entity</div>${head}<div class="c-last">Last activity</div></div>
    ${rows}</div>`;
}

function galleryHTML(list) {
  const cols = famColumns(S.fam, list);
  return `<div class="gal">${list.map(a => {
    const src = SOURCE[a.thumb_source] || SOURCE.publish;
    const sq = a.thumb ? `${img(a.thumb, '')}<span class="tag l">${esc(src.tag)}</span>`
      : `<span>${a.broken ? 'No manifest' : 'No image yet'}</span>`;
    const strip = a.broken ? '' : cols.map(s => { const c = cellModel(a, s); return `<span title="${esc(c.title)}" style="background:${STRIP[c.kind]}"></span>`; }).join('');
    const iss = entityIssue(a);
    return `<button class="card" data-act="pick" data-name="${esc(a.name)}" aria-pressed="false">
      <div class="sq">${sq}</div>
      <div class="cb"><div class="ename" title="${esc(a.name)}">${esc(shortName(a.name))}</div>
        <div class="cl"><span class="etype">${esc(a.type || '—')}${iss ? ` · <span class="${iss.sev}-c">${esc(iss.label)}</span>` : ''}</span><span class="last" style="font-size:10.5px">${esc(fmtDay(lastActivity(a)) || '—')}</span></div>
        <div class="strip">${strip}</div></div>
    </button>`;
  }).join('')}</div>`;
}

function emptyFamilyHTML(fam) {
  const steps = ((S.config.families[fam] || {}).steps || []).join(', ');
  const word = FAM_ONE[fam];
  return `<div class="empty"><h2>No ${word}s yet</h2>
    <p>The ${FAM_DIR[fam]} folder is scaffolded but empty.${steps ? ` ${word[0].toUpperCase() + word.slice(1)} steps in this project: ${esc(steps)}.` : ''}</p>
    <div class="acts"><button class="tool lg" data-act="new-entity" data-fam="${fam}">New ${word}</button></div></div>`;
}
function offlineHTML() {
  return `<div class="empty"><h2>Server offline</h2>
    <p>The page cannot reach the Ylos server. Double-click Ylos to start it, then retry.</p>
    <div class="acts"><button class="tool lg" data-act="retry">Retry</button></div></div>`;
}
function noProjectHTML() {
  const recent = S.recent.map(p => `<button data-act="set-project" data-path="${esc(p)}">
    <span>${esc(p.split('/').pop())}</span> <span class="mono dim" style="font-size:11px">${esc(p)}</span></button>`).join('');
  return `<div class="empty"><h2>No project open</h2>
    <p>Open an existing Ylos project or create one.</p>
    <div class="acts"><button class="primary" data-act="open-project">Open project…</button>
      <button class="tool lg" data-act="new-project">New project…</button></div>
    ${recent ? `<div class="recent"><div class="sec-h">Recent projects</div>${recent}</div>` : ''}</div>`;
}

function markSelection() {
  const list = visibleList();
  if (!list.some(a => a.name === S.sel)) S.sel = list.length ? list[0].name : null;
  el('js-main').querySelectorAll('[data-act="pick"]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.name === S.sel)));
}

// ---------------------------------------------------------------- home: aside
function renderAside() {
  const aside = el('js-aside');
  if (!S.online || !S.project) { aside.classList.add('hidden'); return; }
  aside.classList.remove('hidden');
  if (S.panel === 'integrity') aside.innerHTML = integrityHTML();
  else if (S.panel === 'web') aside.innerHTML = webHTML();
  else aside.innerHTML = lookHTML();
}

function lookHTML() {
  const a = S.assets.find(x => x.name === S.sel);
  if (!a) return `<div class="pad"><div class="ph-text">Select an entity to see where it stands.</div></div>`;
  const sources = imageSources(a);
  const i = Math.min(S.imgTab, Math.max(sources.length - 1, 0));
  const cur = sources[i];
  const image = cur
    ? `${img(cur.url, cur.tag)}<span class="tag m">${esc(cur.tag)}</span>`
    : `<div class="noimg">${a.broken ? 'No manifest, so no image can be resolved for this folder.' : 'No image yet. The first scenefile save or publish renders one.'}</div>`;
  const tabs = sources.length > 1 ? `<div class="tabs-sm" role="group" aria-label="Image source">${sources.map((s, k) =>
    `<button data-act="imgtab" data-i="${k}" aria-pressed="${k === i}">${esc(s.label)}</button>`).join('')}</div>` : '';
  const iss = entityIssue(a);
  const pa = primaryAction(a);
  const meta = a.broken ? `Orphan folder in ${esc(a.family)}/`
    : [FAM_ONE[famOf(a)], a.type, `${(a.steps || []).length} steps`, lastActivity(a) ? 'last activity ' + fmtDay(lastActivity(a)) : ''].filter(Boolean).map(esc).join(' · ');
  const steps = a.broken ? '' : `<section><div class="sec-h">Steps</div>${(a.steps || []).map(s => {
    const c = cellModel(a, s);
    return `<div class="steprow" title="${esc(c.title)}"><span class="nm">${esc(s)}</span><span class="chip k-${c.kind}">${esc(c.text)}</span><span class="sb ${c.tone}">${esc(c.sub)}</span></div>`;
  }).join('')}</section>`;
  return `<div class="pad">
    <div><div class="lookimg">${image}</div>${tabs}${cur && cur.note ? `<div class="note">${esc(cur.note)}</div>` : ''}</div>
    <div><div class="full">${esc(a.name)}</div><div class="ttl">${esc(shortName(a.name))}</div><div class="meta">${meta}</div></div>
    <div class="acts">
      ${pa ? `<button class="primary" data-act="${pa.act}" data-name="${esc(a.name)}" data-step="${esc(pa.step)}" ${pa.v ? `data-v="${pa.v}"` : ''}>${esc(pa.label)}</button>` : ''}
      ${a.broken ? '' : `<button class="tool lg" data-act="details" data-name="${esc(a.name)}">Details</button>`}
      <button class="tool lg" data-act="reveal" data-name="${esc(a.name)}" ${a.broken ? 'disabled title="No manifest: the server cannot resolve this folder"' : ''}>Reveal</button>
    </div>
    ${iss ? `<div class="issue ${iss.sev}-c"><b>${esc(iss.title)}</b><div class="t">${esc(iss.text)}</div></div>` : ''}
    ${steps}
  </div>`;
}

function integrityHTML() {
  const issues = integrityIssues();
  const cards = issues.length ? issues.map((x, k) => `<div class="icard">
      <div class="h"><i style="background:${x.sev === 'bad' ? 'var(--bad)' : 'var(--warn)'}"></i><b>${esc(x.title)}</b></div>
      <div class="e">${esc(x.where)}</div><div class="x">${esc(x.text)}</div>
      <div class="f"><span>${esc(x.source)}</span><button class="tool sm" data-act="show-issue" data-i="${k}">Show</button></div>
    </div>`).join('') : '<div class="box">Nothing to report. Manifests and folders agree.</div>';
  return `<div class="pad tight"><div><div class="ph-title">Integrity</div>
    <div class="ph-text">Inconsistencies found on disk and in manifests. Nothing here is changed automatically.</div></div>${cards}</div>`;
}

function webHTML() {
  const w = S.web;
  if (!w) { loadWebPins().then(() => { renderAside(); renderNav(); }); return '<div class="pad"><div class="ph-text">Loading…</div></div>'; }
  if (w.error) return `<div class="pad"><div class="ph-title">Web pins</div><div class="ph-text">${esc(w.error)}</div></div>`;
  const pins = w.pins || {};
  const available = w.available || {};
  const latestGlb = (name, step) => { const v = ((available[name] || {})[step]) || []; return v.length ? Math.max(...v) : null; };
  const pinned = Object.entries(pins).map(([name, p]) => {
    const latest = latestGlb(name, p.step);
    const note = latest === null ? 'GLB not found' : (latest === p.version ? 'Latest GLB' : `Latest GLB is ${ver(latest)}`);
    const warn = latest === null || latest !== p.version;
    return `<div class="pinrow"><div class="a"><span class="mono" style="font-size:11.5px;overflow-wrap:anywhere">${esc(name)}</span><span class="mono" style="font-size:11.5px">${ver(p.version)}</span></div>
      <div class="b"><span class="dim">${esc(p.step)}</span><span class="${warn ? 'warn-c' : 'muted'}">${esc(note)}</span></div></div>`;
  }).join('') || '<div class="ph-text">Nothing pinned yet.</div>';
  const names = Object.keys(available).sort();
  const editors = names.length ? names.map(name => {
    const p = pins[name]; const cur = p ? `${p.step}|${p.version}` : '';
    let found = !cur;
    const opts = ['<option value="">Not pinned</option>'];
    for (const [step, versions] of Object.entries(available[name])) for (const v of versions) {
      const val = `${step}|${v}`; if (val === cur) found = true;
      opts.push(`<option value="${esc(val)}" ${val === cur ? 'selected' : ''}>${esc(step)} ${ver(v)}</option>`);
    }
    if (!found) opts.push(`<option value="${esc(cur)}" selected>${esc(p.step)} ${ver(p.version)} (not found)</option>`);
    return `<div class="pinrow"><div class="a"><span class="mono" style="font-size:11.5px;overflow-wrap:anywhere">${esc(name)}</span></div>
      <select data-pin="${esc(name)}" aria-label="Pinned version of ${esc(name)}">${opts.join('')}</select></div>`;
  }).join('') : '<div class="ph-text">No GLB publish in this project yet. Publish to GLB from Blender first.</div>';
  const target = w.target_dir
    ? `<div class="box"><div class="kv"><span class="dim">Target folder</span><button class="tool sm" data-act="web-target">Change</button></div>
        <div class="mono" style="font-size:11px;margin-top:6px;overflow-wrap:anywhere">${esc(w.target_dir)}</div></div>`
    : `<div class="box warn"><div class="kv"><span class="dim">Target folder</span><span class="warn-c" style="font-weight:600">Not set</span></div>
        <div style="margin-top:6px">Sync writes public/assets/ into a Three.js project folder. Set one to enable it.</div>
        <button class="tool md" style="margin-top:8px" data-act="web-target">Set target folder</button></div>`;
  return `<div class="pad">
    <div><div class="ph-title">Web pins</div><div class="ph-text">Versions the Three.js project receives on Sync. Never “latest”: each pin is an exact step and version.</div></div>
    ${target}
    <section><div class="sec-h">Pinned</div>${pinned}</section>
    <section><div class="sec-h">Pin a version</div>${editors}</section>
    <div><button class="tool lg" style="width:100%" data-act="sync-web" ${w.target_dir ? '' : 'disabled'}>Sync web</button>
      ${w.target_dir ? '' : '<div class="dim" style="font-size:12px;margin-top:6px">Available once a target folder is set.</div>'}</div>
  </div>`;
}

// ---------------------------------------------------------------- entity page
function entitySteps(d) {
  const steps = [...(d.steps || [])];
  for (const s of [...Object.keys(d.publishes || {}), ...Object.keys(d.scenefiles || {})]) if (!steps.includes(s)) steps.push(s);
  return steps;
}

function renderEntity(force) {
  const box = el('js-entity');
  const d = S.entityData;
  if (!d) { box.innerHTML = `<div class="empty"><p>Loading ${esc(S.entity || '')}…</p></div>`; return; }
  const keep = ['.vers', '.side'].map(q => { const n = box.querySelector(q); return n ? n.scrollTop : 0; });
  const steps = entitySteps(d);
  if (!S.entityStep || !steps.includes(S.entityStep)) {
    S.entityStep = steps.find(s => stepInfo(d, s).status !== 'empty') || steps[0] || null;
  }
  const step = S.entityStep;
  const card = S.assets.find(a => a.name === d.name) || d;
  const fam = DIR_FAM[d.family] || 'asset';
  const list = visibleList(fam);
  const idx = list.findIndex(a => a.name === d.name);
  const src = SOURCE[d.thumb_source] || SOURCE.publish;
  const pa = primaryAction(Object.assign({}, card, { overview: d.overview || card.overview, steps: d.steps }));
  const pin = S.web && S.web.pins ? S.web.pins[d.name] : null;
  const chips = [FAM_ONE[fam], d.type, `${(d.steps || []).length} steps`];
  if (d.created_utc) chips.push('created ' + fmtDay(d.created_utc));
  if (d.frame_range) chips.push(`frames ${d.frame_range.start}–${d.frame_range.end} @ ${d.frame_range.fps} fps`);
  if (pin) chips.push(`pinned for web: ${pin.step} ${ver(pin.version)}`);

  box.innerHTML = `
    <div class="crumbs">
      <a href="#/${FAM_DIR[fam]}" style="text-decoration:none">‹ All entities</a>
      <span class="sepr">/</span><span class="muted">${FAM_LABEL[fam]}</span>
      <span class="sepr">/</span><span class="muted">${esc(d.type || '—')}</span>
      <span class="sepr">/</span><span style="font-weight:600">${esc(shortName(d.name))}</span>
      <div class="grow"></div>
      ${idx >= 0 ? `<span class="mono dim" style="font-size:11.5px">${idx + 1} of ${list.length}</span>` : ''}
      <button class="tool nav-btn" data-act="prev" aria-label="Previous entity" ${list.length < 2 ? 'disabled' : ''}>‹</button>
      <button class="tool nav-btn" data-act="next" aria-label="Next entity" ${list.length < 2 ? 'disabled' : ''}>›</button>
    </div>
    <div class="ehead">
      <div class="eimg">${d.thumb ? `${img(d.thumb, src.tag)}<span class="tag">${esc(src.tag)}</span>` : '<span>No image yet</span>'}</div>
      <div class="info">
        <div><div class="full">${esc(d.name)}</div><h1>${esc(shortName(d.name))}</h1>
          <div class="chips">${chips.filter(Boolean).map(c => `<span>${esc(c)}</span>`).join('')}</div>
          ${src.note && d.thumb ? `<div class="note" style="margin-top:8px">${esc(src.note)}</div>` : ''}</div>
        <div class="acts" style="margin-top:12px">
          ${pa ? `<button class="primary" style="flex:0 0 auto" data-act="${pa.act}" data-name="${esc(d.name)}" data-step="${esc(pa.step)}" ${pa.v ? `data-v="${pa.v}"` : ''}>${esc(pa.label)}</button>` : ''}
          ${step && !(pa && pa.act === 'new-scene' && pa.step === step) ? `<button class="tool lg" data-act="new-scene" data-name="${esc(d.name)}" data-step="${esc(step)}">New ${esc(step)} scene</button>` : ''}
          <button class="tool lg" data-act="reveal" data-name="${esc(d.name)}" data-step="${esc(step || '')}">Reveal</button>
          ${fam === 'shot' ? `<button class="tool lg" data-act="frame-range" data-name="${esc(d.name)}">Frame range</button>` : ''}
        </div>
      </div>
    </div>
    <div class="ebanners">${entityBanners(d)}</div>
    <div class="steptabs" role="tablist" aria-label="Steps">${steps.map(s => {
      const c = cellModel(d, s);
      return `<button class="steptab" role="tab" aria-selected="${s === step}" data-act="step" data-step="${esc(s)}" title="${esc(c.title)}">
        <span class="nm">${esc(s)}</span><span class="chip k-${c.kind}">${esc(c.kind === 'wip' ? 'WIP' : c.text)}</span></button>`;
    }).join('')}</div>
    <div class="split">
      <div class="vers">${step ? versionsHTML(d, step) : '<div class="dashbox">This entity declares no step.</div>'}</div>
      <aside class="side" aria-label="Step details">${step ? sideHTML(d, step) : ''}</aside>
    </div>`;
  ['.vers', '.side'].forEach((q, k) => { const n = box.querySelector(q); if (n) n.scrollTop = keep[k]; });
}

function entityBanners(d) {
  const out = [];
  const icon = c => `<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><path d="M8 2l6.5 11.5h-13z" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.5v3M8 11.3v.2" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  const steps = (d.overview && d.overview.steps) || {};
  for (const [s, i] of Object.entries(steps)) {
    if ((i.abandoned || []).length) out.push({ c: 'var(--warn)', t: `${i.abandoned.length} abandoned publish reservation${i.abandoned.length > 1 ? 's' : ''} in ${s}`,
      x: `${range(i.abandoned)} ${i.abandoned.length > 1 ? 'were' : 'was'} reserved and never finalized. They stay in the manifest as pending.`, src: 'Detected by abandoned_reservations' });
    if (i.behind) out.push({ c: 'var(--warn)', t: `${statusWord(i.status)} ${ver(i.version)} in ${s}, ${ver(i.latest_version)} not reviewed`,
      x: `${ver(i.latest_version)} was published after the ${i.status === 'review' ? 'review request' : 'approval'}. The status still applies to ${ver(i.version)} only.`, src: 'Detected by get_step_status' });
  }
  const outdated = ((d.dependencies || {}).outdated || []).length;
  if (outdated) out.push({ c: 'var(--warn)', t: `${outdated} outdated import${outdated > 1 ? 's' : ''}`,
    x: 'The latest publish was built on a version that now has a newer publish.', src: 'Detected by entity_dependencies' });
  return out.map(b => `<div class="ebanner" style="color:${b.c}">${icon(b.c)}<div class="bt"><b>${esc(b.t)}</b><div>${esc(b.x)}</div><div class="src">${esc(b.src)}</div></div></div>`).join('');
}

function versionsHTML(d, step) {
  const info = stepInfo(d, step);
  const rows = (d.publishes && d.publishes[step]) || [];
  const complete = rows.filter(r => r.status === 'complete').sort((a, b) => b.version - a.version);
  const latest = complete.length ? complete[0].version : null;
  const pin = S.web && S.web.pins ? S.web.pins[d.name] : null;
  const sel = (S.cmp || []).filter(v => complete.some(r => r.version === v));
  const statusFor = v => (info.explicit && info.version === v) ? info.status : null;
  let html = `<div class="vers-h"><h2>${esc(step)}</h2><span class="mono muted" style="font-size:12px">${complete.length} ${complete.length === 1 ? 'version' : 'versions'}</span>
    <div class="grow"></div>${complete.length >= 2 ? '<span class="dim" style="font-size:12px">Tick two versions to compare them</span>' : ''}</div>`;
  if (sel.length === 2) {
    const [a, b] = sel.map(v => complete.find(r => r.version === v)).sort((x, y) => x.version - y.version);
    const deps = r => (r.dependencies || []).map(x => `${shortName(x.entity)} ${x.step} ${x.version ? ver(x.version) : 'root'}`).join(', ') || 'none recorded';
    const fig = r => `<figure>${r.thumb ? img(r.thumb, `Publish render of ${step} ${ver(r.version)}`) : '<div class="ph">No render</div>'}
      <figcaption>${ver(r.version)} · ${esc((r.ext || '').toUpperCase())} · ${esc(fmtWhen(r.published_utc))}</figcaption></figure>`;
    const row = (k, va, vb) => `<div class="dr"><span class="k">${k}</span><span class="v">${esc(va)}</span><span class="v" style="color:${va !== vb ? 'var(--info)' : 'var(--tx)'}">${esc(vb)}</span></div>`;
    html += `<div class="cmp"><div class="ch"><b>Compare</b><span class="mono muted" style="font-size:12px">${ver(a.version)} → ${ver(b.version)}</span>
      <div class="grow"></div><button class="tool sm" data-act="cmp-clear">Clear</button></div>
      <div class="cbody">${fig(a)}${fig(b)}<div class="diff">
        <div class="dh"><span class="k"></span><span class="v mono">${ver(a.version)}</span><span class="v mono">${ver(b.version)}</span></div>
        ${row('Format', (a.ext || '').toUpperCase(), (b.ext || '').toUpperCase())}
        ${row('Published', fmtWhen(a.published_utc), fmtWhen(b.published_utc))}
        ${row('Comment', a.comment || 'none', b.comment || 'none')}
        ${row('Built on', deps(a), deps(b))}
      </div></div></div>`;
  }
  if (complete.length) {
    html += `<div style="margin-top:12px;border-top:1px solid var(--line)">${complete.map(r => {
      const on = sel.includes(r.version);
      const st = statusFor(r.version);
      return `<div class="vrow">
        <button class="check" data-act="cmp" data-v="${r.version}" aria-pressed="${on}" aria-label="${on ? 'Remove' : 'Add'} ${ver(r.version)} ${on ? 'from' : 'to'} the comparison">
          ${on ? '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3L9.5 3.8" fill="none" stroke="#161616" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</button>
        ${r.thumb ? img(r.thumb, `Publish render of ${step} ${ver(r.version)}`) : '<div class="ph">No render</div>'}
        <div class="vmain"><div class="vtop"><span class="vlabel">${ver(r.version)}</span>
          ${r.ext ? `<span class="pill">${esc(r.ext.toUpperCase())}</span>` : ''}
          ${r.version === latest ? '<span class="pill latest">LATEST</span>' : ''}
          ${st ? `<span class="pill ${st === 'approved' ? 'apr' : 'rev'}">${st === 'approved' ? 'APPROVED' : 'IN REVIEW'}</span>` : ''}
          ${pin && pin.step === step && pin.version === r.version ? '<span class="pill pin">PINNED FOR WEB</span>' : ''}
          ${r.exists === false ? '<span class="pill warn">FILE MISSING</span>' : ''}
          ${(r.dependencies || []).length ? `<span class="pill" title="${esc(r.dependencies.map(x => x.entity + ' ' + x.step).join(', '))}">${r.dependencies.length} IMPORT${r.dependencies.length > 1 ? 'S' : ''}</span>` : ''}</div>
          <div class="vdate">${esc(fmtWhen(r.published_utc))}</div>
          ${r.comment ? `<div class="vcom">${esc(r.comment)}</div>` : ''}</div>
        <button class="tool md" data-act="import" data-step="${esc(step)}" data-v="${r.version}">Import into Blender</button>
      </div>`;
    }).join('')}</div>`;
  } else {
    const st = info.status;
    const text = st === 'wip' ? `No publish yet for ${step}. The first publish renders the reference image and becomes v001.`
      : `Nothing on disk for ${step} yet. Start with New scene.`;
    html += `<div class="dashbox">${esc(text)}</div>`;
  }
  const ab = info.abandoned || [];
  if (ab.length) {
    html += `<div class="abox"><div class="ah"><span class="mono muted" style="font-size:12px">${esc(range(ab))}</span>
      <span class="muted">abandoned reservation${ab.length > 1 ? 's' : ''}, nothing to import</span><div class="grow"></div>
      <button class="tool sm" data-act="toggle-abandoned" aria-expanded="${S.showAbandoned}">${S.showAbandoned ? 'Hide' : 'Show'}</button></div>
      ${S.showAbandoned ? ab.slice().sort((x, y) => y - x).map(v => `<div class="ar">${ver(v)} · pending · reserved, never finalized</div>`).join('') : ''}</div>`;
  }
  return html;
}

function sideHTML(d, step) {
  const info = stepInfo(d, step);
  const wips = ((d.scenefiles && d.scenefiles[step]) || []).slice().sort((a, b) => b.version - a.version || String(b.mtime_utc || '').localeCompare(String(a.mtime_utc || '')));
  const wipRows = wips.length ? wips.map(w => {
    const when = w.mtime_utc ? fmtWhen(w.mtime_utc) : (w.date || 'No date recorded');
    const blender = w.dcc === 'blender';
    return `<div class="wrow"><span class="wl">${ver(w.version)}</span><span class="dcc">${esc(w.dcc || '?')}</span>
      <div class="wm">${w.comment ? `<div class="w1">${esc(w.comment)}</div><div class="w2">${esc(when)}</div>` : `<div class="w1 mono muted">${esc(when)}</div>`}</div>
      ${blender ? `<button class="tool sm" data-act="open-wip" data-name="${esc(d.name)}" data-step="${esc(step)}" data-v="${w.version}">Open</button>`
        : '<span class="dim" style="font-size:11px">Open in Houdini</span>'}</div>`;
  }).join('') : `<div class="muted small" style="margin-top:8px">No scenefile for ${esc(step)} yet.</div>`;

  const st = LAB[info.status] ? info.status : 'empty';
  const c = cellModel(d, step);
  const published = info.latest_version != null || st === 'published' || st === 'review' || st === 'approved';
  const latest = info.latest_version;
  const mode = info.explicit ? 'Set by hand' : (st === 'published' ? 'Automatic, read from disk'
    : st === 'wip' ? 'Automatic: scenefiles, no publish' : 'Automatic: nothing on disk');
  let history = `No review or approval recorded for ${step}.`;
  if (info.explicit) {
    history = `${statusWord(st)} ${info.version ? 'for ' + ver(info.version) : '(version not recorded: set before schema 2.3)'}${info.set_utc ? ' on ' + fmtWhen(info.set_utc) : ''}.`;
  }
  const behindLine = info.behind
    ? `<div class="small warn-c" style="margin-top:6px">${ver(latest)} was published after this ${st === 'review' ? 'review request' : 'approval'} and is not reviewed.</div>` : '';
  const acts = published && latest ? `<div class="acts" style="margin-top:10px">
      ${!(st === 'review' && info.version === latest) ? `<button class="tool md" data-act="status" data-step="${esc(step)}" data-status="review" data-v="${latest}">Send ${ver(latest)} to review</button>` : ''}
      ${!(st === 'approved' && info.version === latest) ? `<button class="tool md" data-act="status" data-step="${esc(step)}" data-status="approved" data-v="${latest}">Approve ${ver(latest)}</button>` : ''}
      ${info.explicit ? `<button class="tool md" data-act="status" data-step="${esc(step)}" data-status="${esc(S.config.step_status_auto || 'auto')}">Clear</button>` : ''}
    </div><div class="dim small" style="margin-top:8px">An approval is recorded with its version, so a later publish shows up as newer than the approved one.</div>`
    : '<div class="muted small" style="margin-top:8px">Review and approval need a publish.</div>';

  const deps = d.dependencies || { uses: [], used_in: [], outdated: [] };
  const depRow = (e, side) => {
    const other = side === 'uses' ? e.dependency : e.consumer;
    const dep = e.dependency;
    return `<div class="deprow">
      <div class="d1"><button class="dn" data-act="dep" data-name="${esc(other.entity)}" title="Open ${esc(other.entity)}">${esc(other.entity)}</button>
        ${dep.outdated ? '<span class="badge warn-c">OUTDATED</span>' : ''}</div>
      <div class="d2"><span class="dim">${esc(other.step || 'root')}</span>
        <span class="dv">${ver(dep.version)}${dep.outdated ? ` → ${ver(dep.latest_version)} available` : ''}</span>
        <span class="ds">${esc(e.source || '')}</span></div></div>`;
  };
  return `
    <section><div class="sh"><b>Scenefiles</b><span class="st">${esc(step)}</span><div class="grow"></div>
      <button class="tool sm" data-act="new-scene" data-name="${esc(d.name)}" data-step="${esc(step)}">New scene</button></div>
      <div style="margin-top:8px">${wipRows}</div></section>
    <section><div class="sh"><b>Status</b><span class="st">${esc(step)}</span></div>
      <div class="stline"><span class="chip k-${c.kind}">${esc(c.text)}</span><span class="muted small">${esc(mode)}</span></div>
      <div class="muted small" style="margin-top:6px">${esc(history)}</div>${behindLine}${acts}</section>
    <section><b>Dependencies</b>
      <div class="sec-h" style="margin-top:10px">Built on</div>
      ${(deps.uses || []).length ? deps.uses.map(e => depRow(e, 'uses')).join('') : '<div class="muted small">No recorded imports. A publish records what its scene imported with Import Product.</div>'}
      <div class="sec-h" style="margin-top:12px">Used by</div>
      ${(deps.used_in || []).length ? deps.used_in.map(e => depRow(e, 'used_in')).join('') : '<div class="muted small">No other entity uses this one yet.</div>'}
    </section>`;
}

async function loadEntity() {
  const name = S.entity;
  if (!name) return;
  try {
    const { ok, data, text } = await api(`/api/asset/${encodeURIComponent(name)}`);
    if (S.entity !== name) return;
    if (!ok) { toast(data.error || 'Entity not found', 'err'); location.hash = '#/' + FAM_DIR[S.fam]; return; }
    if (text === S.entityRaw) return;
    S.entityRaw = text;
    S.entityData = data;
    renderEntity();
  } catch { setOnline(false); toast('Server unavailable', 'err'); }
}

// ---------------------------------------------------------------- render + routing
function render() {
  renderHeader();
  const onEntity = S.route.page === 'entity';
  el('js-home').classList.toggle('hidden', onEntity);
  el('js-entity').classList.toggle('hidden', !onEntity);
  el('js-search-wrap').classList.toggle('hidden', onEntity);
  if (onEntity) { renderEntity(); return; }
  renderNav();
  renderMain();
  renderAside();
}

function parseRoute() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (h.startsWith('entity/')) {
    const [name, q] = h.slice(7).split('?');
    return { page: 'entity', name, step: new URLSearchParams(q || '').get('step') };
  }
  return { page: 'home', fam: DIR_FAM[h] || null };
}

async function applyRoute() {
  const r = parseRoute();
  S.route = r;
  if (r.page === 'entity') {
    if (S.entity !== r.name) { S.entity = r.name; S.entityData = null; S.entityRaw = ''; S.cmp = null; S.showAbandoned = false; S.entityStep = r.step || null; }
    else if (r.step) S.entityStep = r.step;
    const card = S.assets.find(a => a.name === r.name);
    if (card) S.fam = famOf(card);
    render();
    if (!S.web) await loadWebPins();
    await loadEntity();
    return;
  }
  S.entity = null; S.entityData = null; S.entityRaw = '';
  if (r.fam) { S.fam = r.fam; writePref('ylos.fam', r.fam); if (S.panel !== 'look' && S.panel !== 'integrity' && S.panel !== 'web') S.panel = 'look'; }
  S.homeSig = '';
  render();
}
const goEntity = (name, step) => { location.hash = '#/entity/' + encodeURIComponent(name) + (step ? '?step=' + encodeURIComponent(step) : ''); };
const goHome = (fam) => { location.hash = '#/' + FAM_DIR[fam || S.fam]; };

// ---------------------------------------------------------------- verbs (server resolves every path)
async function launch(payload, okMessage) {
  try {
    const { ok, data } = await post('/api/open-blender', payload);
    ok ? toast(okMessage) : toast(data.error || 'Error', 'err');
  } catch { toast('Server unavailable', 'err'); }
}
const openScene = (entity, step) => launch({ entity, step }, `Opening ${step} in Blender`);
const openScenefile = (entity, step, v) => launch({ entity, step, scenefile: Number(v) }, `Opening ${step} ${ver(v)} in Blender`);
const createScene = (entity, step) => launch({ entity, step, create: true }, `New ${step} scene: Blender is starting`);
const importPublish = (entity, step, v) => launch({ entity, step, version: Number(v) }, `Importing ${step} ${ver(v)} into a new Blender session`);

async function setStepStatus(entity, step, status, version) {
  const body = { entity, step, status };
  if (version !== undefined && version !== null && version !== '') body.version = Number(version);
  try {
    const { ok, data } = await post('/api/set-step-status', body);
    if (!ok) { toast(data.error || 'Error', 'err'); return; }
    const r = data.step_status || {};
    toast(`${step}: ${statusWord(r.status || status).toLowerCase()}${r.version ? ' for ' + ver(r.version) : ''}`);
    S.entityRaw = ''; await loadEntity(); await refreshAssets();
  } catch { toast('Server unavailable', 'err'); }
}

async function reveal(entity, step) {
  try {
    const { ok, data } = await post('/api/reveal', step ? { entity, step } : { entity });
    ok ? toast('Revealed in Finder') : toast(data.error || 'Error', 'err');
  } catch { toast('Server unavailable', 'err'); }
}

async function pinChange(name, value, select) {
  select.disabled = true;
  try {
    let r;
    if (!value) r = await post('/api/unpin-asset', { name });
    else { const [step, v] = value.split('|'); r = await post('/api/pin-asset', { name, step, version: Number(v) }); }
    if (!r.ok) toast(r.data.error || 'Error', 'err'); else toast(value ? `${shortName(name)} pinned` : `${shortName(name)} unpinned`);
  } catch { toast('Server unavailable', 'err'); }
  await loadWebPins(); renderAside(); renderNav();
}

async function syncWeb() {
  try {
    const { ok, data } = await post('/api/sync-web');
    if (!ok) { toast(data.error || 'Error', 'err'); return; }
    const n = Object.keys(data.synced || {}).length, warn = (data.warnings || []).length;
    toast(`Web sync: ${n} entit${n === 1 ? 'y' : 'ies'}${warn ? `, ${warn} warning${warn > 1 ? 's' : ''}` : ''}`, n === 0 && warn ? 'err' : 'ok');
  } catch { toast('Server unavailable', 'err'); }
}

async function setProject(path) {
  toggleProjectMenu(false);
  try {
    const { ok, data } = await post('/api/set-project', { path });
    if (!ok) { toast(data.error || 'Error', 'err'); return false; }
    await afterProjectChange('Project opened');
    return true;
  } catch { toast('Server unavailable', 'err'); return false; }
}

async function afterProjectChange(message) {
  S.assets = []; S.assetsRaw = ''; S.loaded = false; S.web = null; S.sel = null;
  S.entity = null; S.entityData = null;
  await checkServer(); await loadConfig(); await loadAssets(); await loadRecent();
  if (S.route.page === 'entity') goHome(); else { S.homeSig = ''; render(); }
  if (message) toast(message);
}

async function refreshAssets(manual) {
  if (manual) { S.thumbToken = Date.now(); S.homeSig = ''; S.entityRaw = ''; }
  await checkServer();
  const changed = await loadAssets();
  if (S.route.page === 'entity') { await loadEntity(); if (manual) renderEntity(); }
  else if (changed || manual) render();
  else { renderNav(); renderHeader(); }
}

// ---------------------------------------------------------------- modals
function openModal(title, body, okLabel, onOk, onOpen) {
  const m = el('js-modal');
  m.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><div class="mb">${body}<div class="err" id="js-m-err"></div></div>
    <div class="mf"><button class="tool lg" data-act="modal-cancel">Cancel</button><button class="primary" id="js-m-ok">${esc(okLabel)}</button></div></div>`;
  m.classList.remove('hidden');
  const ok = el('js-m-ok');
  const run = async () => {
    el('js-m-err').textContent = '';
    ok.disabled = true;
    try { await onOk(msg => { el('js-m-err').textContent = msg; }); }
    finally { if (el('js-m-ok')) el('js-m-ok').disabled = false; }
  };
  ok.addEventListener('click', run);
  m.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } }));
  if (onOpen) onOpen(m);
  setTimeout(() => { const f = m.querySelector('input,select'); if (f) f.focus(); }, 30);
}
function closeModal() { const m = el('js-modal'); m.classList.add('hidden'); m.innerHTML = ''; }
const modalOpen = () => !el('js-modal').classList.contains('hidden');

function browseField(id, value) {
  return `<div class="field"><label for="${id}">Folder</label>
    <div class="row"><input id="${id}" value="${esc(value || '')}" placeholder="/Users/you/Projects" spellcheck="false" autocomplete="off">
    <button class="tool lg" data-act="browse" data-for="${id}">Browse</button></div>
    <div class="browse hidden" id="${id}-list"></div></div>`;
}
async function browse(inputId, path) {
  const list = el(inputId + '-list');
  if (!list) return;
  try {
    const { ok, data } = await api('/api/browse' + (path ? '?path=' + encodeURIComponent(path) : ''));
    if (!ok) { el('js-m-err').textContent = data.error || 'Browse error'; return; }
    if (data.path) el(inputId).value = data.path;
    const rows = [];
    if (data.parent !== null && data.parent !== undefined) rows.push(`<button data-act="browse-to" data-for="${inputId}" data-path="${esc(data.parent)}"><span>↑ Parent folder</span></button>`);
    (data.dirs || []).forEach(d => rows.push(`<button data-act="browse-to" data-for="${inputId}" data-path="${esc(d.path)}"><span>${esc(d.name)}</span>${d.is_project ? '<span class="yl">YLOS</span>' : ''}</button>`));
    list.innerHTML = rows.join('') || '<div class="dim" style="padding:6px 8px">Empty folder</div>';
    list.classList.remove('hidden');
  } catch { el('js-m-err').textContent = 'Server unavailable'; }
}
