    const name = el('js-ne-name').value.trim();
    const steps = [...el('js-ne-steps').querySelectorAll('input:checked')].map(i => i.value);
    if (!name) return fail('Name required.');
    if (!steps.length) return fail('At least one step required.');
    try {
      const f = el('js-ne-fam').value;
      const { ok, data } = await post('/api/create-asset', { name, entity_type: f, asset_type: el('js-ne-type').value, steps });
      if (!ok) return fail(data.error || 'Unknown error');
      closeModal();
      toast(`${name} created`);
      S.sel = name; S.fam = f;
      await refreshAssets(true);
      goHome(f);
      // Same as the classic cockpit: the new entity opens straight on its first step.
      if (data.first_step) await openScene(name, data.first_step);
    } catch { fail('Server unavailable'); }
  }, m => {
    fill(fam);
    m.querySelector('#js-ne-fam').addEventListener('change', e => fill(e.target.value));
    const t = m.querySelector('#js-ne-type'), n = m.querySelector('#js-ne-name');
    t.addEventListener('change', () => { if (!n.value || /^[A-Z_]+_$/.test(n.value)) n.value = t.value + '_'; });
    setTimeout(() => { n.value = t.value ? t.value + '_' : ''; n.focus(); }, 40);
  });
}

function frameRangeModal(name) {
  const a = S.assets.find(x => x.name === name) || S.entityData || {};
  const fr = a.frame_range || {};
  openModal(`Frame range: ${shortName(name)}`, `<div class="trio">
      <div class="field"><label for="js-fr-start">Start</label><input id="js-fr-start" inputmode="numeric" value="${esc(fr.start != null ? fr.start : 1001)}"></div>
      <div class="field"><label for="js-fr-end">End</label><input id="js-fr-end" inputmode="numeric" value="${esc(fr.end != null ? fr.end : 1100)}"></div>
      <div class="field"><label for="js-fr-fps">FPS</label><input id="js-fr-fps" inputmode="decimal" value="${esc(fr.fps != null ? fr.fps : 24)}"></div></div>`,
  'Save', async fail => {
    const start = parseInt(el('js-fr-start').value, 10), end = parseInt(el('js-fr-end').value, 10);
    const fpsRaw = el('js-fr-fps').value.trim(); const fps = fpsRaw === '' ? null : parseFloat(fpsRaw);
    if (!Number.isInteger(start) || !Number.isInteger(end)) return fail('Start and End must be whole numbers.');
    if (start >= end) return fail('Start must be lower than End.');
    if (fps !== null && !(fps > 0)) return fail('FPS must be a positive number.');
    const body = { entity: name, start, end }; if (fps !== null) body.fps = fps;
    try {
      const { ok, data } = await post('/api/set-frame-range', body);
      if (!ok) return fail(data.error || 'Unknown error');
      closeModal(); toast('Frame range saved'); S.entityRaw = ''; await refreshAssets();
    } catch { fail('Server unavailable'); }
  });
}

function webTargetModal() {
  openModal('Web target folder', browseField('js-wt-path', (S.web && S.web.target_dir) || '')
    + '<div class="dim small">The Three.js project folder. Sync writes its public/assets/.</div>', 'Save', async fail => {
    const target_dir = el('js-wt-path').value.trim();
    if (!target_dir) return fail('Folder required.');
    try {
      const { ok, data } = await post('/api/set-web-target', { target_dir });
      if (!ok) return fail(data.error || 'Unknown error');
      closeModal(); toast('Web target set'); await loadWebPins(); renderAside(); renderNav();
    } catch { fail('Server unavailable'); }
  });
}

// ---------------------------------------------------------------- toast
let toastTimer = null;
function toast(msg, type = 'ok') {
  const t = el('js-toast');
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.className = 'toast ' + type;
  requestAnimationFrame(() => t.classList.add('show'));
  toastTimer = setTimeout(() => t.classList.remove('show'), type === 'err' ? 4200 : 2600);
}

// ---------------------------------------------------------------- events (delegated: rebuilt DOM never stacks listeners)
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) {
    if (!e.target.closest('#js-proj-wrap')) toggleProjectMenu(false);
    if (e.target === el('js-modal')) closeModal();
    return;
  }
  const d = b.dataset;
  if (d.act !== 'proj-menu' && !b.closest('#js-proj-menu')) toggleProjectMenu(false);
  switch (d.act) {
    case 'pick': S.sel = d.name; S.imgTab = 0; if (S.panel !== 'look') { S.panel = 'look'; renderNav(); } markSelection(); renderAside(); break;
    case 'details': goEntity(d.name); break;
    case 'fam':
      S.panel = 'look';
      if (location.hash === '#/' + FAM_DIR[d.fam]) { S.fam = d.fam; S.homeSig = ''; render(); } else goHome(d.fam);
      break;
    case 'panel': S.panel = d.panel; if (d.panel === 'web' && !S.web) await loadWebPins(); renderNav(); renderAside(); break;
    case 'view': S.view = d.view; writePref('ylos.view', d.view); renderMain(); break;
    case 'imgtab': S.imgTab = Number(d.i) || 0; renderAside(); break;
    case 'show-issue': {
      const x = integrityIssues()[Number(d.i)];
      if (x) { S.sel = x.target; S.panel = 'look'; S.imgTab = 0; if (x.fam !== S.fam) goHome(x.fam); else { renderNav(); renderMain(true); renderAside(); } }
      break;
    }
    case 'open-wip': openScenefile(d.name || S.entity, d.step, d.v); break;
    case 'open-step': openScene(d.name || S.entity, d.step); break;
    case 'new-scene': createScene(d.name || S.entity, d.step); break;
    case 'import': importPublish(S.entity, d.step, d.v); break;
    case 'reveal': reveal(d.name || S.entity, d.step || null); break;
    case 'step': S.entityStep = d.step; S.cmp = null; S.showAbandoned = false; renderEntity(); break;
    case 'cmp': {
      const v = Number(d.v); let next = (S.cmp || []).filter(x => x !== v);
      if (next.length === (S.cmp || []).length) { next = next.concat([v]); if (next.length > 2) next = next.slice(-2); }
      S.cmp = next; renderEntity(); break;
    }
    case 'cmp-clear': S.cmp = []; renderEntity(); break;
    case 'toggle-abandoned': S.showAbandoned = !S.showAbandoned; renderEntity(); break;
    case 'status': setStepStatus(S.entity, d.step, d.status, d.v); break;
    case 'prev': case 'next': {
      const list = visibleList(S.fam); const i = list.findIndex(a => a.name === S.entity);
      if (list.length > 1) { const n = list[(i + (d.act === 'next' ? 1 : -1) + list.length) % list.length]; goEntity(n.name); }
      break;
    }
    case 'dep': goEntity(d.name); break;
    case 'frame-range': frameRangeModal(d.name); break;
    case 'web-target': webTargetModal(); break;
    case 'sync-web': syncWeb(); break;
    case 'proj-menu': await loadRecent(); toggleProjectMenu(); break;
    case 'set-project': setProject(d.path); break;
    case 'open-project': openProjectModal(); break;
    case 'new-project': newProjectModal(); break;
    case 'classic': location.href = '/classic'; break;
    case 'new-entity': newEntityModal(d.fam); break;
    case 'retry': await boot(); break;
    case 'modal-cancel': closeModal(); break;
    case 'browse': browse(d.for, el(d.for).value.trim()); break;
    case 'browse-to': el(d.for).value = d.path; browse(d.for, d.path); break;
  }
});
el('js-proj-btn').dataset.act = 'proj-menu';
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-pin]');
  if (s) pinChange(s.dataset.pin, s.value, s);
});
document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.classList.add('failed'); }, true);
el('js-search').addEventListener('input', e => { S.search = e.target.value; renderMain(); renderAside(); });
el('js-search').addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.search) { e.target.value = ''; S.search = ''; renderMain(); renderAside(); e.stopPropagation(); } else e.target.blur(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); e.target.blur(); moveSelection(1); }
  if (e.key === 'Enter') { const a = S.assets.find(x => x.name === S.sel); if (a && !a.broken) goEntity(a.name); }
});

function moveSelection(delta) {
  const list = visibleList(); if (!list.length) return;
  const i = Math.max(0, list.findIndex(a => a.name === S.sel));
  S.sel = list[Math.min(list.length - 1, Math.max(0, i + delta))].name; S.imgTab = 0;
  if (S.panel !== 'look') { S.panel = 'look'; renderNav(); }
  markSelection(); renderAside();
  const row = el('js-main').querySelector(`[data-act="pick"][data-name="${CSS.escape(S.sel)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
}

const typing = () => { const t = document.activeElement; return !!t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable); };
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if (modalOpen()) { closeModal(); return; }
    if (!el('js-proj-menu').classList.contains('hidden')) { toggleProjectMenu(false); return; }
    if (S.route.page === 'entity') { goHome(); return; }
    return;
  }
  if (modalOpen()) return;
  const k = e.key.toLowerCase();
  if ((mod && k === 'k') || (e.key === '/' && !mod && !typing())) {
    if (S.route.page === 'home' && S.project) { e.preventDefault(); el('js-search').focus(); el('js-search').select(); }
    return;
  }
  if (mod && k === 'n') { e.preventDefault(); if (e.shiftKey || !S.project) newProjectModal(); else newEntityModal(); return; }
  if (mod && k === 'r' && !e.shiftKey) { e.preventDefault(); refreshAssets(true); return; }
  if (typing() || mod || e.altKey) return;
  if (S.route.page === 'home' && S.project) {
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); moveSelection(1); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); moveSelection(-1); }
    else if (e.key === 'Enter') { const a = S.assets.find(x => x.name === S.sel); if (a && !a.broken) goEntity(a.name); }
  } else if (S.route.page === 'entity') {
    if (e.key === 'ArrowRight' || e.key === ']') document.querySelector('[data-act="next"]')?.click();
    else if (e.key === 'ArrowLeft' || e.key === '[') document.querySelector('[data-act="prev"]')?.click();
  }
});

window.addEventListener('hashchange', applyRoute);

// ---------------------------------------------------------------- boot + poll
async function boot() {
  await checkServer();
  await loadConfig();
  await loadRecent();
  await loadAssets();
  if (S.project) loadWebPins().then(() => { if (S.route.page === 'home') { renderNav(); if (S.panel === 'web') renderAside(); } });
  if (!location.hash) history.replaceState(null, '', '#/' + FAM_DIR[S.fam]);
  await applyRoute();
}
boot();
setInterval(() => { if (!document.hidden && !modalOpen()) refreshAssets(false); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAssets(false); });
</script>
</body>
</html>
